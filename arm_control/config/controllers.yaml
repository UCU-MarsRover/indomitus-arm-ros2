controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

/**:
  ros__parameters:
    joints:
      - joint_0
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    allow_partial_joints_goal: false
    open_loop_control: true
    allow_nonzero_velocity_at_trajectory_end: true

    constraints:
      goal_time: 5.0
      stopped_velocity_tolerance: 0.05
      joint_0:
        trajectory: 2.0
        goal: 2.0
      joint_1:
        trajectory: 2.0
        goal: 2.0
      joint_2:
        trajectory: 2.0
        goal: 2.0
      joint_3:
        trajectory: 2.0
        goal: 2.0
      joint_4:
        trajectory: 2.0
        goal: 2.0
      joint_5:
        trajectory: 2.0
        goal: 2.0
