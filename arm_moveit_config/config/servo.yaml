moveit_servo:
  ros__parameters:
    status_topic: /servo_node/status

    cartesian_command_in_topic: /servo_node/delta_twist_cmds
    joint_command_in_topic: /servo_node/delta_joint_cmds

    robot_link_command_frame: base_link
    command_in_type: speed_units

    scale:
      linear: 0.30
      rotational: 0.30
      joint: 0.30

    override_velocity_scaling_factor: 0.60

    command_out_topic: /arm_trajectory_controller/joint_trajectory
    command_out_type: trajectory_msgs/JointTrajectory

    publish_period: 0.02
    low_latency_mode: false

    publish_joint_positions: true
    publish_joint_velocities: true
    publish_joint_accelerations: false

    joint_topic: /joint_states

    move_group_name: arm
    planning_frame: base_link
    ee_frame_name: link_5

    is_primary_planning_scene_monitor: false
    monitored_planning_scene_topic: /monitored_planning_scene

    incoming_command_timeout: 0.2
    num_outgoing_halt_msgs_to_publish: 4
    halt_all_joints_in_joint_mode: true
    halt_all_joints_in_cartesian_mode: true

    lower_singularity_threshold: 100.0
    hard_stop_singularity_threshold: 200.0
    leaving_singularity_threshold_multiplier: 2.0
    joint_limit_margin: 0.02

    check_collisions: false
    collision_check_rate: 5.0
    self_collision_proximity_threshold: 0.01
    scene_collision_proximity_threshold: 0.01
